@if (musicOrigin === MusicOrigin.Youtube) {
  <app-music-player-youtube [musicUrl]="music.music!"
    (ready)="OnPlayerReady($event)"></app-music-player-youtube>
}
@if (musicOrigin === MusicOrigin.Soundcloud) {
  <app-music-player-soundcloud [musicUrl]="music.music!"
    (ready)="OnPlayerReady($event)"></app-music-player-soundcloud>
}

@if (game?.gameRounds) {
  <app-player-display [gameRound]="game!.gameRounds[0]"></app-player-display>
}
