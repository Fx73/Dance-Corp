<div style="display: flex; justify-content: center;">
<div class="player-hud" [style.width.px]="GetConfigValue('canvasWidth')">
  <div class="score"> {{gameRound.player.name}} - Level {{ gameRound.level }} : {{ GetDisplayScore() }}</div>
  <div class="performance-container" >
    <div class="performance-bar" [style.width.%]="gameRound.performance" [style.backgroundColor]="GetPerformanceColor()">
      @if (GetConfigValue('trainingMode')) {
        <div class="performance-label"> Training Mode </div>
      }
      @if (gameRound.isFailed) {
        <div class="performance-label"> Failed </div>
      }
    </div>
  </div>
</div>
</div>
<div style="display: flex; justify-content: center;">
  <div class="canvas-container">
    <div class="guide-line">
      <div id="precision-text-left" [style]="{left: 12.5 + '%', top:ARROW_CORRECTED_SIZE() + 'px'}" class="text-goal">Perfect</div>
      <div id="precision-text-down" [style]="{left: 37.5 + '%', top:ARROW_CORRECTED_SIZE() + 'px'}" class="text-goal">Perfect</div>
      <div id="precision-text-up" [style]="{left: 62.5 + '%' , top:ARROW_CORRECTED_SIZE() + 'px'}" class="text-goal">Perfect</div>
      <div id="precision-text-right" [style]="{left: 87.5 + '%', top:ARROW_CORRECTED_SIZE() + 'px'}" class="text-goal">Perfect</div>
      <img src="assets/Arrow/Arrow.png" alt="ArrowLeft" [width]="ARROW_CORRECTED_SIZE()" [height]="ARROW_CORRECTED_SIZE()" [style]="{ left: 12.5 + '%', transform: 'rotate(45deg) translate(-50%, -50%)' }" class="arrow-goal" [ngClass]="{'active': gameRound.dancepad.lastExposedState[ArrowDirection.Left] !== 0}" />
      <img src="assets/Arrow/Arrow.png" alt="ArrowDown" [width]="ARROW_CORRECTED_SIZE()" [height]="ARROW_CORRECTED_SIZE()" [style]="{ left: 37.5 + '%', transform: 'rotate(-45deg) translate(-50%, -50%)' }" class="arrow-goal" [ngClass]="{'active': gameRound.dancepad.lastExposedState[ArrowDirection.Down] !== 0}" />
      <img src="assets/Arrow/Arrow.png" alt="ArrowUp" [width]="ARROW_CORRECTED_SIZE()" [height]="ARROW_CORRECTED_SIZE()" [style]="{ left: 62.5 + '%', transform: 'rotate(135deg) translate(-50%, -50%)' }" class="arrow-goal" [ngClass]="{'active': gameRound.dancepad.lastExposedState[ArrowDirection.Up] !== 0}" />
      <img src="assets/Arrow/Arrow.png" alt="ArrowRight" [width]="ARROW_CORRECTED_SIZE()" [height]="ARROW_CORRECTED_SIZE()" [style]="{ left: 87.5 + '%', transform: 'rotate(-135deg) translate(-50%, -50%)' }" class="arrow-goal" [ngClass]="{'active': gameRound.dancepad.lastExposedState[ArrowDirection.Right] !== 0}" />
    </div>
    <canvas #gameCanvas></canvas>
    <div id="combo-text" [style.visibility]="gameRound.comboCount >= 4 ? 'visible' : 'hidden'" [ngClass]="{'animate': gameRound.comboCount >= 4}">Combo {{gameRound.comboCount}}</div>
  </div>
</div>
