name: Deploy
on:
  workflow_dispatch:
  push:
    branches:
      - "dev"
      - "master"

concurrency:
  group: deploy-${{ github.ref_name }}
  cancel-in-progress: false

env:
  # master deploys to production, every other branch to the dev project
  IS_PROD: ${{ github.ref_name == 'master' }}

jobs:
  # dev: bumps the patch version before building. master: tags the release (its minor is bumped by release.yml).
  version:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      sha: ${{ steps.bump.outputs.sha || github.sha }}
    steps:
      - uses: actions/checkout@v6

      - name: Npm setup
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Bump the patch version
        id: bump
        if: github.event_name == 'push' && github.ref_name == 'dev' && github.event.before != '0000000000000000000000000000000000000000'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BEFORE: ${{ github.event.before }}
        run: |
          git fetch --depth=1 origin "$BEFORE"
          PREVIOUS=$(git show "$BEFORE:package.json" | node -p "JSON.parse(require('fs').readFileSync(0, 'utf8')).version")
          CURRENT=$(node -p "require('./package.json').version")
          # A version changed by hand in the pushed commits (e.g. a new major) is kept
          if [ "$PREVIOUS" != "$CURRENT" ]; then
            echo "Version changed by the push ($PREVIOUS -> $CURRENT), kept"
            exit 0
          fi
          npm version patch --no-git-tag-version
          echo "sha=$(bash .github/scripts/commit-version.sh dev "$GITHUB_SHA")" >> "$GITHUB_OUTPUT"

      - name: Tag the release
        if: github.event_name == 'push' && github.ref_name == 'master'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if git ls-remote --exit-code --tags origin "refs/tags/v$VERSION" > /dev/null; then
            echo "Tag v$VERSION already exists"
            exit 0
          fi
          gh api "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/tags/v$VERSION" -f sha="$GITHUB_SHA"

  web:
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.version.outputs.sha }}

      - name: Npm setup
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci

      - name: Build
        run: npx ng build --configuration=${{ env.IS_PROD == 'true' && 'production' || 'dev' }}

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ env.IS_PROD == 'true' && secrets.FIREBASE_SERVICE_ACCOUNT_DANCE_CORP || secrets.FIREBASE_SERVICE_ACCOUNT_DANCE_CORP_DEV }}

      - name: Deploy Firestore rules and indexes
        working-directory: website
        run: npx firebase-tools@15 deploy --only firestore --non-interactive --project ${{ env.IS_PROD == 'true' && 'dance-corp' || 'dance-corp-dev' }}

      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ env.IS_PROD == 'true' && secrets.FIREBASE_SERVICE_ACCOUNT_DANCE_CORP || secrets.FIREBASE_SERVICE_ACCOUNT_DANCE_CORP_DEV }}
          projectId: ${{ env.IS_PROD == 'true' && 'dance-corp' || 'dance-corp-dev' }}
          entryPoint: website
          channelId: live

  desktop:
    needs: version
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.version.outputs.sha }}

      - name: Npm setup
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Build with Tauri
        run: npx tauri build ${{ env.IS_PROD == 'true' && ' ' || '--config src-tauri/tauri.dev.conf.json' }}

      - name: Upload installers
        uses: actions/upload-artifact@v6
        with:
          name: desktop-${{ github.ref_name }}
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
